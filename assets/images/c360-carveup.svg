<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="The 360 layout carved into reusable regions: identity and actions header, reference data, health and KPIs, timeline, transactional data, activity and recommended actions">
  <rect width="1200" height="520" fill="#efe9f4"/>

  <!-- header band -->
  <rect x="48" y="40" width="1104" height="64" rx="10" fill="#191621"/>
  <circle cx="84" cy="72" r="16" fill="#3d3747"/>
  <text x="112" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#948ea0">BASIC ACCOUNT DETAILS &#183; IDENTITY</text>
  <text x="112" y="86" font-family="Georgia, serif" font-size="14" fill="#efe9f4">Who the customer is</text>
  <rect x="960" y="56" width="176" height="32" rx="16" fill="#7a3b8f"/>
  <text x="1048" y="77" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff">Call to actions</text>

  <!-- LEFT: reference data -->
  <rect x="48" y="120" width="300" height="360" rx="10" fill="#f7f4fa" stroke="#c7bdd3" stroke-dasharray="4 4"/>
  <text x="68" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#635d6c">ACCOUNT REFERENCE DATA</text>
  <rect x="68" y="158" width="260" height="94" rx="8" fill="#ffffff" stroke="#e7e1ec"/>
  <text x="84" y="182" font-family="Georgia, serif" font-size="13" fill="#191621">Sold products</text>
  <rect x="84" y="196" width="200" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="212" width="160" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="228" width="180" height="7" rx="3" fill="#e2dce8"/>
  <rect x="68" y="262" width="260" height="94" rx="8" fill="#ffffff" stroke="#e7e1ec"/>
  <text x="84" y="286" font-family="Georgia, serif" font-size="13" fill="#191621">Contacts &amp; relationships</text>
  <rect x="84" y="300" width="200" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="316" width="160" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="332" width="180" height="7" rx="3" fill="#e2dce8"/>
  <rect x="68" y="366" width="260" height="94" rx="8" fill="#ffffff" stroke="#e7e1ec"/>
  <text x="84" y="390" font-family="Georgia, serif" font-size="13" fill="#191621">Service contracts</text>
  <rect x="84" y="404" width="200" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="420" width="160" height="7" rx="3" fill="#e2dce8"/><rect x="84" y="436" width="180" height="7" rx="3" fill="#e2dce8"/>

  <!-- CENTER -->
  <rect x="364" y="120" width="470" height="150" rx="10" fill="#f4edf8" stroke="#d8b8e0" stroke-dasharray="4 4"/>
  <text x="384" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#5c2c6c">ACCOUNT HEALTH &amp; HIGH-LEVEL KPIs</text>
  <circle cx="440" cy="210" r="34" fill="none" stroke="#d8b8e0" stroke-width="10"/>
  <path d="M440 176 a34 34 0 0 1 28 52" fill="none" stroke="#7a3b8f" stroke-width="10"/>
  <rect x="520" y="180" width="120" height="14" rx="7" fill="#7a3b8f"/>
  <rect x="520" y="204" width="180" height="14" rx="7" fill="#d8b8e0"/>
  <rect x="520" y="228" width="150" height="14" rx="7" fill="#ead9f0"/>

  <rect x="364" y="282" width="470" height="80" rx="10" fill="#f7f4fa" stroke="#c7bdd3" stroke-dasharray="4 4"/>
  <text x="384" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#635d6c">ACCOUNT TIMELINE / LIFE EVENTS</text>
  <line x1="388" y1="336" x2="810" y2="336" stroke="#e2dce8" stroke-width="2"/>
  <circle cx="420" cy="336" r="6" fill="#7a3b8f"/><circle cx="520" cy="336" r="6" fill="#191621"/><circle cx="620" cy="336" r="6" fill="#7a3b8f"/><circle cx="720" cy="336" r="6" fill="#191621"/>

  <rect x="364" y="374" width="470" height="106" rx="10" fill="#f7f4fa" stroke="#c7bdd3" stroke-dasharray="4 4"/>
  <text x="384" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#635d6c">TRANSACTIONAL DATA &#183; ORDERS / CASES / TASKS</text>
  <line x1="384" y1="414" x2="814" y2="414" stroke="#e7e1ec"/>
  <rect x="384" y="426" width="180" height="7" rx="3" fill="#c7bdd3"/><rect x="680" y="426" width="60" height="7" rx="3" fill="#7a3b8f"/>
  <rect x="384" y="446" width="220" height="7" rx="3" fill="#e2dce8"/><rect x="680" y="446" width="60" height="7" rx="3" fill="#d9d2e2"/>
  <rect x="384" y="466" width="150" height="7" rx="3" fill="#e2dce8"/><rect x="680" y="466" width="60" height="7" rx="3" fill="#e2dce8"/>

  <!-- RIGHT -->
  <rect x="850" y="120" width="302" height="230" rx="10" fill="#f7f4fa" stroke="#c7bdd3" stroke-dasharray="4 4"/>
  <text x="870" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#635d6c">ACCOUNT ACTIVITY</text>
  <g>
    <rect x="870" y="158" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
    <rect x="870" y="190" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
    <rect x="870" y="222" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
    <rect x="870" y="254" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
    <rect x="870" y="286" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
    <rect x="870" y="318" width="262" height="26" rx="6" fill="#ffffff" stroke="#e7e1ec"/>
  </g>
  <rect x="850" y="362" width="302" height="118" rx="10" fill="#f4edf8" stroke="#d8b8e0" stroke-dasharray="4 4"/>
  <text x="870" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#5c2c6c">RECOMMENDED ACTIONS</text>
  <rect x="870" y="400" width="262" height="30" rx="8" fill="#ffffff" stroke="#d8b8e0"/>
  <rect x="870" y="438" width="262" height="30" rx="8" fill="#ffffff" stroke="#d8b8e0"/>
</svg>
