<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Horizontal platform diagram: a Core CSM Platform base, a Customer Ops module layer, and industry verticals built on top">
  <rect width="1200" height="520" fill="#eaedfb"/>

  <!-- Industry pillars -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- pillar 1 -->
    <rect x="80" y="70" width="180" height="160" rx="12" fill="#e7ecfc" stroke="#b7c2f5"/>
    <text x="170" y="112" text-anchor="middle" font-size="16" font-family="Georgia, serif" fill="#191621">HCLS</text>
    <text x="170" y="136" text-anchor="middle" font-size="12" fill="#565a72">Healthcare &amp; Life Sci</text>
    <rect x="112" y="156" width="116" height="26" rx="13" fill="#ffffff" stroke="#455ce9"/>
    <text x="170" y="173" text-anchor="middle" font-size="11" fill="#334bd3">Patient 360</text>
    <text x="170" y="211" text-anchor="middle" font-size="11" fill="#6a6f8a">Care team &amp; patient workflows</text>
    <!-- pillar 2 -->
    <rect x="290" y="70" width="180" height="160" rx="12" fill="#e7ecfc" stroke="#b7c2f5"/>
    <text x="380" y="112" text-anchor="middle" font-size="16" font-family="Georgia, serif" fill="#191621">PSDS</text>
    <text x="380" y="136" text-anchor="middle" font-size="12" fill="#565a72">Public Sector</text>
    <rect x="308" y="156" width="144" height="26" rx="13" fill="#ffffff" stroke="#455ce9"/>
    <text x="380" y="173" text-anchor="middle" font-size="11" fill="#334bd3">Constituent 360</text>
    <text x="380" y="211" text-anchor="middle" font-size="11" fill="#6a6f8a">Constituent case &amp; benefits</text>
    <!-- pillar 3 -->
    <rect x="500" y="70" width="180" height="160" rx="12" fill="#e7ecfc" stroke="#b7c2f5"/>
    <text x="590" y="112" text-anchor="middle" font-size="16" font-family="Georgia, serif" fill="#191621">FSO</text>
    <text x="590" y="136" text-anchor="middle" font-size="12" fill="#565a72">Financial Services</text>
    <rect x="522" y="156" width="136" height="26" rx="13" fill="#ffffff" stroke="#455ce9"/>
    <text x="590" y="173" text-anchor="middle" font-size="11" fill="#334bd3">Customer 360</text>
    <text x="590" y="211" text-anchor="middle" font-size="11" fill="#6a6f8a">Relationship &amp; portfolio view</text>
    <!-- pillar 4 -->
    <rect x="710" y="70" width="180" height="160" rx="12" fill="#e7ecfc" stroke="#b7c2f5"/>
    <text x="800" y="112" text-anchor="middle" font-size="16" font-family="Georgia, serif" fill="#191621">Telco</text>
    <text x="800" y="136" text-anchor="middle" font-size="12" fill="#565a72">Telecommunications</text>
    <rect x="732" y="156" width="136" height="26" rx="13" fill="#ffffff" stroke="#455ce9"/>
    <text x="800" y="173" text-anchor="middle" font-size="11" fill="#334bd3">Customer 360</text>
    <text x="800" y="211" text-anchor="middle" font-size="11" fill="#6a6f8a">Subscriber &amp; service ops</text>
    <!-- pillar 5 -->
    <rect x="920" y="70" width="180" height="160" rx="12" fill="#e7ecfc" stroke="#b7c2f5"/>
    <text x="1010" y="112" text-anchor="middle" font-size="16" font-family="Georgia, serif" fill="#191621">Retail</text>
    <text x="1010" y="136" text-anchor="middle" font-size="12" fill="#565a72">Retail &amp; Hospitality</text>
    <rect x="936" y="156" width="148" height="26" rx="13" fill="#ffffff" stroke="#455ce9"/>
    <text x="1010" y="173" text-anchor="middle" font-size="11" fill="#334bd3">Service Org 360</text>
    <text x="1010" y="211" text-anchor="middle" font-size="11" fill="#6a6f8a">Store &amp; associate workflows</text>
  </g>

  <!-- connectors: verticals sit on top of the horizontal layer -->
  <g stroke="#b7c2f5" stroke-width="2" fill="none">
    <path d="M170 230 L170 264"/>
    <path d="M380 230 L380 264"/>
    <path d="M590 230 L590 264"/>
    <path d="M800 230 L800 264"/>
    <path d="M1010 230 L1010 264"/>
  </g>
  <g fill="#b7c2f5">
    <path d="M170 264 l-6 -10 h12 z"/>
    <path d="M380 264 l-6 -10 h12 z"/>
    <path d="M590 264 l-6 -10 h12 z"/>
    <path d="M800 264 l-6 -10 h12 z"/>
    <path d="M1010 264 l-6 -10 h12 z"/>
  </g>

  <!-- Customer Ops module row -->
  <rect x="60" y="272" width="1080" height="90" rx="14" fill="#ffffff" stroke="#d8ddf5" stroke-width="1.5"/>
  <text x="84" y="302" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#334bd3">CUSTOMER OPS</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#191621" text-anchor="middle">
    <rect x="84" y="312" width="160" height="34" rx="8" fill="#191621"/>
    <text x="164" y="334" fill="#eaedfb">Customer 360</text>
    <rect x="254" y="312" width="160" height="34" rx="8" fill="#f2f4fd" stroke="#d8ddf5"/>
    <text x="334" y="334">Service Org 360</text>
    <rect x="424" y="312" width="160" height="34" rx="8" fill="#f2f4fd" stroke="#d8ddf5"/>
    <text x="504" y="334">Order Mgmt</text>
    <rect x="594" y="312" width="150" height="34" rx="8" fill="#f2f4fd" stroke="#d8ddf5"/>
    <text x="669" y="334">Install Base</text>
    <rect x="754" y="312" width="180" height="34" rx="8" fill="#f2f4fd" stroke="#d8ddf5"/>
    <text x="844" y="334">Post-Sales Support</text>
    <rect x="944" y="312" width="180" height="34" rx="8" fill="#f2f4fd" stroke="#d8ddf5"/>
    <text x="1034" y="334">Process Layouts</text>
  </g>

  <!-- connector: ops sits on the core platform -->
  <g stroke="#565a72" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M600 362 L600 386"/>
  </g>
  <path d="M600 386 l-6 -10 h12 z" fill="#565a72" opacity="0.55"/>

  <!-- Core platform base -->
  <rect x="60" y="392" width="1080" height="66" rx="14" fill="#191621"/>
  <text x="84" y="422" font-family="Georgia, serif" font-size="16" fill="#eaedfb">Core CSM Platform</text>
  <text x="1116" y="422" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8890b0">Workspace &amp; Portal</text>
  <text x="600" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#565a72">ONE HORIZONTAL FOUNDATION</text>

  <!-- title -->
  <text x="60" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#565a72">INDUSTRY VERTICALS BUILT ON A HORIZONTAL PRODUCT</text>
</svg>
