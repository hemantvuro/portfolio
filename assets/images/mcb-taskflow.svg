<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Task flow: Tell me plus Tweak it. Describe, AI drafts, human tweaks, guardrails, activate.">
  <rect width="1200" height="470" fill="#f9f1e8"/>

  <text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#a85c22">AI-FIRST</text>
  <text x="60" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6b5c4a">HUMAN CONTROL &amp; GUARDRAILS</text>

  <rect x="60" y="90" width="230" height="120" rx="12" fill="#191621"/>
  <text x="82" y="126" font-family="Georgia, serif" font-size="16" fill="#ffffff">1 &#183; Describe</text>
  <text x="82" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbb99e">User states channels +</text>
  <text x="82" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#cbb99e">intent in plain language.</text>

  <line x1="290" y1="150" x2="345" y2="150" stroke="#c8722f" stroke-width="2"/>
  <path d="M345 150 l-10 -5 v10 z" fill="#c8722f"/>

  <rect x="350" y="90" width="250" height="120" rx="12" fill="#f2e4d3" stroke="#c8722f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="372" y="126" font-family="Georgia, serif" font-size="16" fill="#a85c22">2 &#183; AI drafts ~80%</text>
  <text x="372" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">Understands intent, drafts a</text>
  <text x="372" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">live preview, asks clarifying</text>
  <text x="372" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">questions.</text>

  <line x1="600" y1="150" x2="655" y2="150" stroke="#c8722f" stroke-width="2"/>
  <path d="M655 150 l-10 -5 v10 z" fill="#c8722f"/>

  <rect x="660" y="90" width="240" height="120" rx="12" fill="#ffffff" stroke="#ecdfcb" stroke-width="1.5"/>
  <text x="682" y="126" font-family="Georgia, serif" font-size="16" fill="#191621">3 &#183; Tweak</text>
  <text x="682" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">User reviews the preview and</text>
  <text x="682" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">adjusts any element with</text>
  <text x="682" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">full granular control.</text>

  <line x1="780" y1="210" x2="780" y2="290" stroke="#6b5c4a" stroke-width="2"/>
  <path d="M780 290 l-5 -10 h10 z" fill="#6b5c4a"/>

  <rect x="480" y="290" width="300" height="120" rx="12" fill="#f7ede1" stroke="#6b5c4a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="502" y="326" font-family="Georgia, serif" font-size="16" fill="#191621">4 &#183; Guardrails</text>
  <text x="502" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">Proactive AI audit, fallback</text>
  <text x="502" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">creation, approval &#8212; keeps the</text>
  <text x="502" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">output valid and compliant.</text>

  <line x1="780" y1="350" x2="855" y2="350" stroke="#191621" stroke-width="2"/>
  <path d="M855 350 l-10 -5 v10 z" fill="#191621"/>

  <rect x="860" y="318" width="240" height="64" rx="32" fill="#191621"/>
  <text x="980" y="357" font-family="Georgia, serif" font-size="18" fill="#ffffff" text-anchor="middle">Activate &#10003;</text>

  <text x="60" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b5c4a">"Tell me + Tweak it" balances the speed of AI generation with the granular control enterprise users require.</text>
</svg>
