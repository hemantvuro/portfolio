<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-label="Patient 360 concept: one shared patient record in the centre that reshapes into a nurse view on the left and a doctor view on the right">
  <rect width="1200" height="515" fill="#f2eee7"/>

  <!-- shared core -->
  <rect x="500" y="70" width="200" height="375" rx="14" fill="#141414"/>
  <text x="600" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#9a9488">ONE RECORD</text>
  <circle cx="600" cy="150" r="26" fill="#3a3a38"/>
  <circle cx="600" cy="143" r="9" fill="#c9c3b8"/>
  <path d="M584 168 a16 13 0 0 1 32 0 z" fill="#c9c3b8"/>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f2eee7">Anna Lewis</text>
  <text x="600" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9a9488">Patient</text>
  <g>
    <rect x="532" y="248" width="136" height="9" rx="4" fill="#4a4a48"/>
    <rect x="532" y="270" width="136" height="9" rx="4" fill="#4a4a48"/>
    <rect x="532" y="292" width="136" height="9" rx="4" fill="#4a4a48"/>
    <rect x="532" y="314" width="136" height="9" rx="4" fill="#4a4a48"/>
    <rect x="532" y="336" width="136" height="9" rx="4" fill="#4a4a48"/>
  </g>
  <text x="600" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#c8452f">SHARED DATA CORE</text>
  <rect x="532" y="396" width="136" height="30" rx="8" fill="#c8452f"/>
  <text x="600" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff">reshapes per role</text>

  <!-- connectors -->
  <line x1="500" y1="257" x2="430" y2="257" stroke="#c8452f" stroke-width="2.5"/>
  <path d="M430 257 l12 -6 l0 12 z" fill="#c8452f"/>
  <line x1="700" y1="257" x2="770" y2="257" stroke="#c8452f" stroke-width="2.5"/>
  <path d="M770 257 l-12 -6 l0 12 z" fill="#c8452f"/>

  <!-- NURSE VIEW (left) -->
  <rect x="60" y="70" width="370" height="375" rx="14" fill="#ffffff" stroke="#e6e2da" stroke-width="1.5"/>
  <rect x="60" y="70" width="370" height="40" rx="14" fill="#faf8f4"/>
  <rect x="60" y="96" width="370" height="14" fill="#faf8f4"/>
  <text x="84" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#9a3320">NURSE VIEW</text>
  <rect x="330" y="80" width="82" height="22" rx="11" fill="#c8452f"/>
  <text x="371" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff">Add to queue</text>
  <rect x="84" y="132" width="322" height="86" rx="10" fill="#faf8f4" stroke="#e6e2da"/>
  <text x="100" y="156" font-family="Georgia, serif" font-size="13" fill="#141414">Notes for doctor</text>
  <rect x="100" y="170" width="240" height="7" rx="3" fill="#e0dbd1"/>
  <rect x="100" y="186" width="290" height="7" rx="3" fill="#e0dbd1"/>
  <rect x="100" y="202" width="200" height="7" rx="3" fill="#e0dbd1"/>
  <text x="84" y="246" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6f6b63">VITALS</text>
  <g>
    <rect x="84" y="256" width="72" height="52" rx="8" fill="#fbeee9" stroke="#e7b9ac"/>
    <rect x="166" y="256" width="72" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
    <rect x="248" y="256" width="72" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
    <rect x="330" y="256" width="76" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
  </g>
  <text x="84" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6f6b63">CARE TEAM</text>
  <circle cx="98" cy="360" r="11" fill="#eceae6"/><rect x="118" y="356" width="150" height="8" rx="4" fill="#c9c3b8"/>
  <circle cx="98" cy="388" r="11" fill="#eceae6"/><rect x="118" y="384" width="120" height="8" rx="4" fill="#e0dbd1"/>
  <circle cx="98" cy="416" r="11" fill="#eceae6"/><rect x="118" y="412" width="140" height="8" rx="4" fill="#e0dbd1"/>

  <!-- DOCTOR VIEW (right) -->
  <rect x="770" y="70" width="370" height="375" rx="14" fill="#ffffff" stroke="#e6e2da" stroke-width="1.5"/>
  <rect x="770" y="70" width="370" height="40" rx="14" fill="#faf8f4"/>
  <rect x="770" y="96" width="370" height="14" fill="#faf8f4"/>
  <text x="794" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#9a3320">DOCTOR VIEW</text>
  <rect x="1028" y="80" width="88" height="22" rx="11" fill="#c8452f"/>
  <text x="1072" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff">Consultation</text>
  <rect x="794" y="132" width="322" height="96" rx="10" fill="#fbeee9" stroke="#e7b9ac"/>
  <text x="810" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#9a3320">AI SUMMARY</text>
  <rect x="810" y="168" width="288" height="7" rx="3" fill="#c9a99f"/>
  <rect x="810" y="184" width="288" height="7" rx="3" fill="#c9a99f"/>
  <rect x="810" y="200" width="220" height="7" rx="3" fill="#c9a99f"/>
  <text x="794" y="256" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6f6b63">NURSE NOTES</text>
  <rect x="794" y="266" width="322" height="70" rx="10" fill="#faf8f4" stroke="#e6e2da"/>
  <rect x="810" y="282" width="200" height="7" rx="3" fill="#e0dbd1"/>
  <rect x="810" y="298" width="260" height="7" rx="3" fill="#e0dbd1"/>
  <rect x="810" y="314" width="160" height="7" rx="3" fill="#e0dbd1"/>
  <text x="794" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#6f6b63">RECORDS</text>
  <g>
    <rect x="794" y="370" width="100" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
    <rect x="904" y="370" width="100" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
    <rect x="1014" y="370" width="102" height="52" rx="8" fill="#faf8f4" stroke="#e6e2da"/>
  </g>

  <text x="60" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6f6b63">ONE SYSTEM, TWO CLINICIANS</text>
</svg>
