<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Consultation journey swimlane: a nurse lane and a doctor lane across pre-consultation, during consultation, and post-consultation phases">
  <rect width="1200" height="500" fill="#e6f2ee"/>
  <text x="48" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#55605b">THE CONSULTATION JOURNEY</text>

  <!-- phase headers -->
  <text x="300" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#191621">Pre-consultation</text>
  <text x="620" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#191621">During consultation</text>
  <text x="1000" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#191621">Post-consultation</text>
  <line x1="440" y1="100" x2="440" y2="440" stroke="#dceae5" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="800" y1="100" x2="800" y2="440" stroke="#dceae5" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- lane labels -->
  <rect x="24" y="120" width="34" height="150" rx="8" fill="#2f7a68"/>
  <text x="41" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#ffffff" transform="rotate(-90 41 195)">NURSE</text>
  <rect x="24" y="290" width="34" height="150" rx="8" fill="#191621"/>
  <text x="41" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#e6f2ee" transform="rotate(-90 41 365)">DOCTOR</text>

  <!-- DOCTOR lane: not yet involved placeholder for pre-consultation -->
  <rect x="100" y="303" width="280" height="40" rx="10" fill="none" stroke="#b8d0c8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="240" y="327" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#8a9a94">not yet involved</text>

  <!-- NURSE lane steps -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="76" y="120" width="160" height="66" rx="10" fill="#ffffff" stroke="#a9d4c6"/>
    <text x="90" y="146" font-family="Georgia, serif" font-size="13" fill="#191621">Check-in</text>
    <text x="90" y="166" font-size="11" fill="#55605b">verify patient,</text>
    <text x="90" y="180" font-size="11" fill="#55605b">reason for visit</text>

    <rect x="252" y="120" width="168" height="66" rx="10" fill="#ffffff" stroke="#a9d4c6"/>
    <text x="266" y="146" font-family="Georgia, serif" font-size="13" fill="#191621">Assess</text>
    <text x="266" y="166" font-size="11" fill="#55605b">capture vitals,</text>
    <text x="266" y="180" font-size="11" fill="#55605b">add to queue</text>

    <rect x="540" y="120" width="168" height="66" rx="10" fill="#ffffff" stroke="#a9d4c6"/>
    <text x="554" y="146" font-family="Georgia, serif" font-size="13" fill="#191621">Coordinate</text>
    <text x="554" y="166" font-size="11" fill="#55605b">administer an</text>
    <text x="554" y="180" font-size="11" fill="#55605b">in-office treatment</text>

    <rect x="828" y="120" width="180" height="66" rx="10" fill="#ffffff" stroke="#a9d4c6"/>
    <text x="842" y="146" font-family="Georgia, serif" font-size="13" fill="#191621">Facilitate</text>
    <text x="842" y="166" font-size="11" fill="#55605b">review plan, guide</text>
    <text x="842" y="180" font-size="11" fill="#55605b">on next steps</text>

    <rect x="1024" y="120" width="152" height="66" rx="10" fill="#f1f8f6" stroke="#d7e8e3"/>
    <text x="1038" y="146" font-family="Georgia, serif" font-size="13" fill="#191621">Check-out</text>
    <text x="1038" y="166" font-size="11" fill="#55605b">record updated,</text>
    <text x="1038" y="180" font-size="11" fill="#55605b">next steps clear</text>
  </g>

  <!-- DOCTOR lane steps -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="452" y="290" width="164" height="66" rx="10" fill="#f1f8f6" stroke="#b8d0c8"/>
    <text x="466" y="316" font-family="Georgia, serif" font-size="13" fill="#191621">Understand</text>
    <text x="466" y="336" font-size="11" fill="#55605b">history, records,</text>
    <text x="466" y="350" font-size="11" fill="#55605b">diagnostic reports</text>

    <rect x="632" y="290" width="156" height="66" rx="10" fill="#191621"/>
    <text x="646" y="316" font-family="Georgia, serif" font-size="13" fill="#e6f2ee">Diagnose</text>
    <text x="646" y="336" font-size="11" fill="#b8d0c8">examine, take</text>
    <text x="646" y="350" font-size="11" fill="#b8d0c8">notes, decide</text>

    <rect x="804" y="290" width="196" height="66" rx="10" fill="#f1f8f6" stroke="#b8d0c8"/>
    <text x="818" y="316" font-family="Georgia, serif" font-size="13" fill="#191621">Treat &amp; prescribe</text>
    <text x="818" y="336" font-size="11" fill="#55605b">explain, order treatment,</text>
    <text x="818" y="350" font-size="11" fill="#55605b">prescribe meds</text>
  </g>

  <!-- NURSE lane flow arrows -->
  <g stroke="#2f7a68" stroke-width="2" fill="none">
    <path d="M236 153 L252 153"/>
    <path d="M420 153 L540 153"/>
    <path d="M708 153 L828 153"/>
    <path d="M1008 153 L1024 153"/>
  </g>
  <g fill="#2f7a68">
    <path d="M252 153 l-10 -5 v10 z"/>
    <path d="M540 153 l-10 -5 v10 z"/>
    <path d="M828 153 l-10 -5 v10 z"/>
    <path d="M1024 153 l-10 -5 v10 z"/>
  </g>

  <!-- DOCTOR lane flow arrows -->
  <g stroke="#191621" stroke-width="2" fill="none">
    <path d="M616 323 L632 323"/>
    <path d="M788 323 L804 323"/>
  </g>
  <g fill="#191621">
    <path d="M632 323 l-10 -5 v10 z"/>
    <path d="M804 323 l-10 -5 v10 z"/>
  </g>

  <!-- hand-off: nurse Assess -> doctor Understand -->
  <path d="M336 186 C336 240, 534 240, 534 290" stroke="#2f7a68" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <path d="M534 290 l-5 -10 h10 z" fill="#2f7a68"/>
  <rect x="322" y="228" width="60" height="16" rx="8" fill="#e6f2ee" opacity="0.85"/>
  <text x="352" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#225c4e">hand-off</text>

  <!-- hand-off: doctor Treat & prescribe -> nurse Check-out (routed clear of both boxes) -->
  <path d="M1000 323 C1060 323, 1100 260, 1100 186" stroke="#55605b" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <path d="M1100 186 l-5 10 h10 z" fill="#55605b"/>
  <rect x="1075" y="238" width="86" height="16" rx="8" fill="#e6f2ee" opacity="0.85"/>
  <text x="1118" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#55605b">back to nurse</text>
</svg>
